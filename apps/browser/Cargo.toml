[package]
name = "void-browser"
description = "Void — a modern-only web browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "void"
path = "src/main.rs"

[dependencies]
void-dom.workspace = true
void-css.workspace = true
void-layout.workspace = true
void-paint.workspace = true
void-js.workspace = true
vello.workspace = true
parley.workspace = true
winit.workspace = true
notify.workspace = true
pollster.workspace = true
png = "0.18"
url = "2"
arboard = "3"

[build-dependencies]
winresource = "0.1"

# Windows installer: `cargo packager -p void-browser --release`
[package.metadata.packager]
productName = "Void"
identifier = "io.voidbrowser.void"
publisher = "Void contributors"
homepage = "https://github.com/voidbrowser-io/void-browser"
description = "A modern-only web browser: TSX without a bundler, signals, GPU rendering."
outDir = "../../dist"
beforePackagingCommand = "cargo build -p void-browser --release"
formats = ["nsis"]
icons = ["icons/icon.ico", "icons/icon.png"]
binaries = [{ path = "void", main = true }]

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "icons/icon.ico"
